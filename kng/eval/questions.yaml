# KNG evaluation set — 30 questions grounded in the real archive.
#
# Every `meets` entry is a press-meet id that actually exists in `index/` (check
# with `python -m kng.eval --meets`), so a miss is a retrieval failure and never a
# typo in this file. Expectations are deliberately *coarse*: the right press meet,
# not the right chunk. Nobody hand-labelled 4267 passages, and pretending
# otherwise would produce a precise-looking number measuring nothing.
#
# fields
#   id       stable slug; use it with `--only`
#   q        the question, exactly as a user would type it
#   lang     en | te — the script the question is written in
#   kind     single  one meet holds the answer
#            cross   the answer spans several meets (what the graph leg is for)
#            temporal asks how something changed over time
#            numeric asks for a figure, where BM25 usually carries the retrieval
#   meets    press-meet ids that should appear in the retrieved passages
#   entities graph entity names the question ought to link (substring, case-insensitive)

questions:
  # ── TTD / laddu ─────────────────────────────────────────────────────────────
